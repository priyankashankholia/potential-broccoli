name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - feature/first-due-date
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - feature/first-due-date

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Oryx, the builder Static Web Apps uses by default, only carries
      # Node 24.13 and Angular 22 needs 24.15. Building here instead and
      # uploading the result sidesteps that entirely.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Build Angular
        working-directory: rent-manager-web
        run: |
          npm ci
          npm run build

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUSHROOM_06A8B5500 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "rent-manager-web/dist/rent-manager-web/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MUSHROOM_06A8B5500 }}
          action: "close"