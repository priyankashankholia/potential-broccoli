<h1>Rent Manager</h1>

<h2>Shops</h2>

<input
  [(ngModel)]="newShopName"
  placeholder="Shop name"
/>

<button type="button" (click)="addShop()">
  Add Shop
</button>

<hr>

<p>Total shops: {{ shops().length }}</p>

@for (shop of shops(); track shop.id) {
  <div>
    <strong>{{ shop.name }}</strong>
    -
    {{ shop.isOccupied ? 'Occupied' : 'Vacant' }}
  </div>
}
